<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AnythingLLM 文档上传</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .container { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 32px; width: 480px; max-width: 90vw; }
  h1 { font-size: 20px; margin-bottom: 20px; color: #fff; }
  .drop-zone { border: 2px dashed #555; border-radius: 8px; padding: 40px 20px; text-align: center; cursor: pointer; margin-bottom: 16px; transition: border-color .2s; }
  .drop-zone:hover, .drop-zone.dragover { border-color: #4ade80; }
  .drop-zone .icon { font-size: 36px; margin-bottom: 8px; }
  .drop-zone p { color: #888; font-size: 14px; }
  .drop-zone .filename { color: #4ade80; font-weight: 600; margin-top: 8px; display: none; }
  #fileInput { display: none; }
  .info { background: #222; border-radius: 6px; padding: 10px 14px; margin-bottom: 16px; font-size: 12px; color: #888; }
  .info span { color: #4ade80; }
  button { width: 100%; padding: 12px; background: #4ade80; color: #000; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
  button:hover { background: #22c55e; }
  button:disabled { background: #444; color: #666; cursor: not-allowed; }
  #status { text-align: center; font-size: 14px; min-height: 20px; }
  #status.success { color: #4ade80; }
  #status.error { color: #ef4444; }
</style>
</head>
<body>
<div class="container">
  <h1>📄 上传文档到 AnythingLLM</h1>
  <div class="drop-zone" id="dropZone">
    <div class="icon">📁</div>
    <p>点击或拖放文件到此处</p>
    <div class="filename" id="fileName"></div>
  </div>
  <input type="file" id="fileInput">
  <div class="info">
    目标工作区：<span>我的工作区</span><br>
    API：<span>POST /api/v1/document/upload</span>
  </div>
  <button id="uploadBtn" disabled>上传并向量化</button>
  <div id="status"></div>
</div>
<script>
const API_KEY = 'M0EHT1D-8CHM3BM-M5ZCWHV-HDTDYE6';
const WORKSPACE_SLUG = '92a4c670-8abb-4dc3-b6bd-d426b75f7ebd';
const UPLOAD_URL = 'http://localhost:3001/api/v1/document/upload';

const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const fileName = document.getElementById('fileName');
const uploadBtn = document.getElementById('uploadBtn');
const status = document.getElementById('status');

let selectedFile = null;

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files[0]) selectFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if (e.target.files[0]) selectFile(e.target.files[0]); });

function selectFile(file) {
  selectedFile = file;
  fileName.textContent = file.name;
  fileName.style.display = 'block';
  uploadBtn.disabled = false;
  status.textContent = '';
  status.className = '';
}

uploadBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  uploadBtn.disabled = true;
  status.textContent = '上传中...';
  status.className = '';
  const form = new FormData();
  form.append('file', selectedFile);
  form.append('addToWorkspaces', WORKSPACE_SLUG);
  try {
    const res = await fetch(UPLOAD_URL, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + API_KEY },
      body: form
    });
    const data = await res.json();
    if (data.success) {
      status.textContent = '✅ 上传成功，文档已向量化！';
      status.className = 'success';
    } else {
      status.textContent = '❌ 上传失败：' + (data.error || '未知错误');
      status.className = 'error';
    }
  } catch (err) {
    status.textContent = '❌ 请求失败：' + err.message;
    status.className = 'error';
  }
  uploadBtn.disabled = false;
});
</script>
</body>
</html>
